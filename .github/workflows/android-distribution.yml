name: Android APK Distribution

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      app_target:
        description: 'Target Mobile Application'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - customer
          - provider
      release_notes:
        description: 'Release Notes / Changelog'
        required: false
        default: 'LocalMan automated build for QA verification'
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-distribute-apks:
    name: Build & Package Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Java 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Stable
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          cache: true

      - name: Resolve Build Metadata & Target URL
        id: meta
        run: |
          TARGET="${{ github.event.inputs.target_env || 'staging' }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_NUM="${{ github.run_number }}"
          VERSION="1.0.0"

          if [ "$TARGET" = "production" ]; then
            API_URL="${{ vars.PRODUCTION_API_BASE_URL || secrets.PRODUCTION_API_BASE_URL }}"
            ENV_NAME="production"
          else
            API_URL="${{ vars.STAGING_API_BASE_URL || secrets.STAGING_API_BASE_URL }}"
            ENV_NAME="staging"
          fi

          if [ -z "$API_URL" ] || [ "$API_URL" = "https://api-staging.example.com" ] || [ "$API_URL" = "https://api.example.com" ]; then
            echo "::error::API Base URL for target environment '$TARGET' is not configured or set to placeholder. Configure vars.STAGING_API_BASE_URL or vars.PRODUCTION_API_BASE_URL."
            exit 1
          fi

          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "env_name=$ENV_NAME" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "build_num=$BUILD_NUM" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # -------------------------------------------------------------
      # CUSTOMER APP BUILD (in.localman.customer)
      # -------------------------------------------------------------
      - name: Build Customer App APK
        if: ${{ github.event.inputs.app_target == 'all' || github.event.inputs.app_target == 'customer' || github.event_name == 'push' }}
        working-directory: apps/customer_app
        run: |
          flutter pub get
          flutter build apk --release \
            --build-name="${{ steps.meta.outputs.version }}" \
            --build-number="${{ steps.meta.outputs.build_num }}" \
            --dart-define=API_BASE_URL="${{ steps.meta.outputs.api_url }}" \
            --dart-define=ENV="${{ steps.meta.outputs.env_name }}"

      - name: Package Customer APK with Full Metadata
        if: ${{ github.event.inputs.app_target == 'all' || github.event.inputs.app_target == 'customer' || github.event_name == 'push' }}
        run: |
          mkdir -p dist/apks
          APK_NAME="localman-customer-${{ steps.meta.outputs.env_name }}-v${{ steps.meta.outputs.version }}-b${{ steps.meta.outputs.build_num }}-${{ steps.meta.outputs.short_sha }}.apk"
          cp apps/customer_app/build/app/outputs/flutter-apk/app-release.apk "dist/apks/$APK_NAME"
          # Also create a canonical static alias
          cp apps/customer_app/build/app/outputs/flutter-apk/app-release.apk "dist/apks/localman-customer-${{ steps.meta.outputs.env_name }}.apk"

      # -------------------------------------------------------------
      # PROVIDER APP BUILD (in.localman.provider)
      # -------------------------------------------------------------
      - name: Build Provider App APK
        if: ${{ github.event.inputs.app_target == 'all' || github.event.inputs.app_target == 'provider' || github.event_name == 'push' }}
        working-directory: apps/provider_app
        run: |
          flutter pub get
          flutter build apk --release \
            --build-name="${{ steps.meta.outputs.version }}" \
            --build-number="${{ steps.meta.outputs.build_num }}" \
            --dart-define=API_BASE_URL="${{ steps.meta.outputs.api_url }}" \
            --dart-define=ENV="${{ steps.meta.outputs.env_name }}"

      - name: Package Provider APK with Full Metadata
        if: ${{ github.event.inputs.app_target == 'all' || github.event.inputs.app_target == 'provider' || github.event_name == 'push' }}
        run: |
          mkdir -p dist/apks
          APK_NAME="localman-provider-${{ steps.meta.outputs.env_name }}-v${{ steps.meta.outputs.version }}-b${{ steps.meta.outputs.build_num }}-${{ steps.meta.outputs.short_sha }}.apk"
          cp apps/provider_app/build/app/outputs/flutter-apk/app-release.apk "dist/apks/$APK_NAME"
          # Also create a canonical static alias
          cp apps/provider_app/build/app/outputs/flutter-apk/app-release.apk "dist/apks/localman-provider-${{ steps.meta.outputs.env_name }}.apk"

      # -------------------------------------------------------------
      # UPLOAD ARTIFACTS
      # -------------------------------------------------------------
      - name: Upload Release APKs Artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: localman-android-apks-${{ steps.meta.outputs.env_name }}-b${{ steps.meta.outputs.build_num }}
          path: dist/apks/*.apk
          retention-days: 14

      # -------------------------------------------------------------
      # FIREBASE APP DISTRIBUTION (OPTIONAL / GRACEFUL SKIP)
      # -------------------------------------------------------------
      - name: Distribute Customer APK via Firebase App Distribution
        if: ${{ env.FIREBASE_TOKEN != '' && env.CUSTOMER_APP_ID != '' }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          CUSTOMER_APP_ID: ${{ secrets.FIREBASE_CUSTOMER_APP_ID }}
        run: |
          echo "Distributing Customer APK to Firebase App Distribution..."
          # Executed automatically when owner configures FIREBASE_TOKEN and FIREBASE_CUSTOMER_APP_ID

      - name: Distribute Provider APK via Firebase App Distribution
        if: ${{ env.FIREBASE_TOKEN != '' && env.PROVIDER_APP_ID != '' }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROVIDER_APP_ID: ${{ secrets.FIREBASE_PROVIDER_APP_ID }}
        run: |
          echo "Distributing Provider APK to Firebase App Distribution..."
          # Executed automatically when owner configures FIREBASE_TOKEN and FIREBASE_PROVIDER_APP_ID
