name: LocalMan CI Pipeline

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend API & Database CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: localman_user
          POSTGRES_PASSWORD: localman_ci_password_2026
          POSTGRES_DB: localman_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Shared Packages
        run: |
          npm run build --workspace=@localman/constants
          npm run build --workspace=@localman/contracts
          npm run build --workspace=@localman/design-tokens

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Apply Database Migrations (PostgreSQL + PostGIS)
        env:
          DATABASE_URL: postgresql://localman_user:localman_ci_password_2026@localhost:5432/localman_db?schema=public
        run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma

      - name: Build Backend API
        run: npm run build --workspace=@localman/api

      - name: Run Backend Test Suites
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://localman_user:localman_ci_password_2026@localhost:5432/localman_db?schema=public
          JWT_SECRET: super_secret_localman_jwt_signing_key_replace_in_prod_2026_xyz
          BOOKING_OTP_PEPPER: localman_secure_booking_otp_pepper_secret_2026
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          STORAGE_PROVIDER: mock
          SMS_GATEWAY_PROVIDER: mock
          PAYMENT_GATEWAY_PROVIDER: mock
        run: npm test --workspace=@localman/api

  admin-web-ci:
    name: Admin Web Portal CI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Shared Packages
        run: |
          npm run build --workspace=@localman/constants
          npm run build --workspace=@localman/contracts
          npm run build --workspace=@localman/design-tokens

      - name: Typecheck and Build Admin Web (Vite)
        run: npm run build --workspace=@localman/admin-web

  mobile-apps-ci:
    name: Flutter Mobile Apps CI (Customer & Provider)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Java 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Stable
        uses: subosito/flutter-action@f721806e60b296417ad0165c3abecda7444ac4d3 # v2.18.0
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Customer App — Pub Get & Analyze
        working-directory: apps/customer_app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos

      - name: Customer App — Unit & Widget Tests
        working-directory: apps/customer_app
        run: flutter test

      - name: Provider App — Pub Get & Analyze
        working-directory: apps/provider_app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos

      - name: Provider App — Unit & Widget Tests
        working-directory: apps/provider_app
        run: flutter test
