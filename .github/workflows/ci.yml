name: LocalMan CI Pipeline

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend API & Database CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: localman_user
          POSTGRES_PASSWORD: localman_ci_password_2026
          POSTGRES_DB: localman_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Shared Packages
        run: |
          npm run build --workspace=@localman/constants
          npm run build --workspace=@localman/contracts
          npm run build --workspace=@localman/design-tokens

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Apply Database Migrations (PostgreSQL + PostGIS)
        env:
          DATABASE_URL: postgresql://localman_user:localman_ci_password_2026@localhost:5432/localman_db?schema=public
        run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma

      - name: Build Backend API
        run: npm run build --workspace=@localman/api

      - name: Run Backend Test Suites
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://localman_user:localman_ci_password_2026@localhost:5432/localman_db?schema=public
          JWT_SECRET: super_secret_localman_jwt_signing_key_replace_in_prod_2026_xyz
          BOOKING_OTP_PEPPER: localman_secure_booking_otp_pepper_secret_2026
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          STORAGE_PROVIDER: mock
          SMS_GATEWAY_PROVIDER: mock
          PAYMENT_GATEWAY_PROVIDER: mock
        run: npm test --workspace=@localman/api

  admin-web-ci:
    name: Admin Web Portal CI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Shared Packages
        run: |
          npm run build --workspace=@localman/constants
          npm run build --workspace=@localman/contracts
          npm run build --workspace=@localman/design-tokens

      - name: Typecheck and Build Admin Web (Vite)
        run: npm run build --workspace=@localman/admin-web

  customer-flutter-ci:
    name: Customer Flutter App CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Java 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Stable
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Customer App — Pub Get & Analyze
        working-directory: apps/customer_app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos

      - name: Customer App — Unit & Widget Tests
        working-directory: apps/customer_app
        run: flutter test

  provider-flutter-ci:
    name: Provider Flutter App CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Java 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Stable
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Provider App — Pub Get & Analyze
        working-directory: apps/provider_app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos

      - name: Provider App — Unit & Widget Tests
        working-directory: apps/provider_app
        run: flutter test

  build-staging-apks:
    name: Build Staging Android APKs (Customer & Provider)
    needs: [backend-ci, admin-web-ci, customer-flutter-ci, provider-flutter-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Staging Environment Configuration
        id: check-staging-config
        run: |
          STAGING_URL="${{ vars.STAGING_API_BASE_URL }}"
          if [ -z "$STAGING_URL" ] || [ "$STAGING_URL" = "null" ] || [[ "$STAGING_URL" == *"example.com"* ]] || [[ "$STAGING_URL" == *"placeholder"* ]]; then
            echo "::notice title=Staging APK Build Skipped::STAGING_API_BASE_URL repository variable is not configured or contains a placeholder. Staging APK generation is safely skipped until a real staging backend is provisioned."
            echo "skip_build=true" >> $GITHUB_OUTPUT
          else
            echo "STAGING_API_BASE_URL is configured: $STAGING_URL"
            echo "skip_build=false" >> $GITHUB_OUTPUT
            echo "staging_url=$STAGING_URL" >> $GITHUB_OUTPUT
          fi

      - name: Setup Java 17
        if: steps.check-staging-config.outputs.skip_build != 'true'
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Stable
        if: steps.check-staging-config.outputs.skip_build != 'true'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          cache: true

      - name: Customer App — Build Staging APK
        if: steps.check-staging-config.outputs.skip_build != 'true'
        working-directory: apps/customer_app
        run: |
          flutter pub get
          flutter build apk --release \
            --dart-define=API_BASE_URL="${{ steps.check-staging-config.outputs.staging_url }}" \
            --dart-define=ENV="staging"

      - name: Provider App — Build Staging APK
        if: steps.check-staging-config.outputs.skip_build != 'true'
        working-directory: apps/provider_app
        run: |
          flutter pub get
          flutter build apk --release \
            --dart-define=API_BASE_URL="${{ steps.check-staging-config.outputs.staging_url }}" \
            --dart-define=ENV="staging"

      - name: Package Staging APKs
        if: steps.check-staging-config.outputs.skip_build != 'true'
        run: |
          mkdir -p dist/apks
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_NUM="${{ github.run_number }}"
          cp apps/customer_app/build/app/outputs/flutter-apk/app-release.apk "dist/apks/localman-customer-staging-b${BUILD_NUM}-${SHORT_SHA}.apk"
          cp apps/customer_app/build/app/outputs/flutter-apk/app-release.apk "dist/apks/localman-customer-staging-latest.apk"
          cp apps/provider_app/build/app/outputs/flutter-apk/app-release.apk "dist/apks/localman-provider-staging-b${BUILD_NUM}-${SHORT_SHA}.apk"
          cp apps/provider_app/build/app/outputs/flutter-apk/app-release.apk "dist/apks/localman-provider-staging-latest.apk"

      - name: Upload Staging APKs Artifact
        if: steps.check-staging-config.outputs.skip_build != 'true'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: localman-staging-apks-b${{ github.run_number }}
          path: dist/apks/*.apk
          retention-days: 14
